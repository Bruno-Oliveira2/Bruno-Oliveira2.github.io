<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atlas Solar 3D</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Interface sobreposta ao 3D -->
    <div id="ui-container">
        <h1>Atlas Solar 3D</h1>
        <p>Arraste para girar, scroll para zoom</p>
        <div id="info-box">
            <h3>Informações do Planeta</h3>
            <p id="planet-data">Clique em um planeta para ver os detalhes da API...</p>
        </div>
    </div>

    <!-- O Three.js injetará o canvas aqui embaixo automaticamente -->
    
    <!-- Link para o arquivo JavaScript (usando module para suportar imports) -->
    <script type="module" src="main.js"></script>
</body>
</html>
