<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="./styles/style.css">
        <script src="./index.js" defer></script>
        <title>Solar System Explorer</title>
        <link href="./imgs/logo.png" rel="icon" alt="icon">
    </head>
    <body>
        <header>
            <a href="index.html"><img src="imgs/logo.png" class="logo" alt="logo"></a>
            <h1>Solar System Explorer</h1>
            <div class="search-wrapper">
                <input type="text" class="search-input" placeholder="Search">
                <img src="imgs/search.jpg" class="Search" alt="Search">
            </div>
        </header>
        <div>
            <aside class="side-bar">
                <nav>
                    <a href="#">
                        <img src="imgs/menubar.png" alt="menu" height="50px" width="auto">
                        <span class="nav-text">Menu</span>
                    </a>
                    <a href="compare.html">
                        <img src="imgs/compare.png" alt="compare" height="50px" width="auto">
                        <span class="nav-text">Compare</span>
                    </a>
                    <a href="about.html">
                        <img src="imgs/image (1).png" alt="about us" height="50px" width="auto">
                        <span class="nav-text">About Us</span>
                    </a>
                </nav>
            </aside>
            <section>
                <div class="solar-system">
                    <div class="sun"></div>
                    <div class="orbit orbit-1">
                        <div class="planet" data-name="Mercury" style="background: radial-gradient(circle at 35% 35%, #d4d4d4, #6b6b6b);"></div>
                    </div>
                    <div class="orbit orbit-2">
                        <div class="planet" data-name="Venus" style="background: radial-gradient(circle at 35% 35%, #f5deb3, #c8813a);"></div>
                    </div>
                    <div class="orbit orbit-3">
                        <div class="planet" data-name="Earth" style="background: radial-gradient(circle at 35% 35%, #4fc3f7, #1a6b2a);"></div>
                    </div>
                    <div class="orbit orbit-4">
                        <div class="planet" data-name="Mars" style="background: radial-gradient(circle at 35% 35%, #e8724a, #7a1f0a);"></div>
                    </div>
                    <div class="orbit orbit-5">
                        <div class="planet" data-name="Jupiter" style="background: radial-gradient(circle at 35% 35%, #e8c99a, #a0522d);"></div>
                    </div>
                    <div class="orbit orbit-6">
                        <div class="planet" data-name="Saturn" style="background: radial-gradient(circle at 35% 35%, #f0e68c, #b8962e);"></div>
                    </div>
                    <div class="orbit orbit-7">
                        <div class="planet" data-name="Uranus" style="background: radial-gradient(circle at 35% 35%, #b2eff5, #2e8b8b);"></div>
                    </div>
                    <div class="orbit orbit-8">
                        <div class="planet" data-name="Neptune" style="background: radial-gradient(circle at 35% 35%, #5b7fe8, #1a237e);"></div>
                    </div>
                </div>
                <div class="popup-overlay" id="popupOverlay">
                    <div class="popup">
                        <button class="popup-close" id="popupClose">✕</button>
                        <h2 class="popup-planet-name" id="popupPlanetName"></h2>
                        <p class="popup-info">Insert info here as needed.</p>
                    </div>
                </div>
            </section>
        </div>
        <footer>
            <img src="imgs/email-logo.png" class="email" alt="email-logo">
            <img src="imgs/github-logo.png" class="git-hub" alt="gitub-logo">
        </footer>
    </body>
</html>
